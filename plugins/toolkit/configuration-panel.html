<section id="configuration-maintenance" aria-label="Configuration maintenance">
<h2>Configuration service</h2>
<p>Preview both legacy documents before confirming migration. Existing JSON files remain unchanged. Backups stay in the isolated configuration service.</p>
<p id="config-capabilities" role="status">Checking Host capabilities…</p>
<fieldset><legend>Host settings</legend><div id="config-fields"></div><button id="config-save" type="button" disabled>Save changed fields</button><details><summary>Stored configuration (read only)</summary><pre id="config-raw"></pre></details></fieldset>
<div class="settings-grid">
<fieldset><legend>Legacy settings</legend><label>Settings JSON <input id="config-settings-file" type="file" accept=".json,application/json"></label><label><input id="config-settings-defaults" type="checkbox"> Use default settings explicitly</label></fieldset>
<fieldset><legend>Legacy download preferences</legend><label>Preferences JSON <input id="config-preferences-file" type="file" accept=".json,application/json"></label><label><input id="config-preferences-defaults" type="checkbox"> Use empty preferences explicitly</label></fieldset>
</div>
<div class="actions"><button id="config-status" class="button" type="button">Check service</button><button id="config-reload" class="button" type="button">Reload settings</button><button id="config-preview" class="button" type="button">Preview migration</button><button id="config-confirm" class="button" type="button" disabled>Confirm this migration</button><button id="config-backup" class="button" type="button">Create backup</button></div>
<label>Backup ID <input id="config-backup-id" placeholder="backup-…sqlite" autocomplete="off"></label>
<div class="actions"><button id="config-restore" class="button" type="button" disabled>Restore backup…</button><button id="config-retry" class="button" type="button" disabled>Retry last request</button></div>
<pre id="config-result" role="status" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:28rem;overflow:auto"></pre>
</section>
<script nonce="__TOKEN__">
(()=>{
const $=id=>document.getElementById(id),buttons=['status','reload','preview','confirm','backup','restore','retry','save'];
let preview=null,last=null,busy=false,unavailable=!window.orcaToolkitConfiguration,status=null,snapshot=null,original=null;
const fields=[['accounts','enabled',true],['accounts','environment',''],['accounts','worktree',''],['downloads','enabled',true],['downloads','environment',''],['downloads','sshHost',''],['downloads','sshUser',''],['downloads','sshPort',22],['gpu','enabled',true]];
for(const [section,key,defaultValue] of fields){const label=document.createElement('label'),input=document.createElement('input');label.textContent=section+' / '+key+' ';input.id='setting-'+section+'-'+key;input.type=typeof defaultValue==='boolean'?'checkbox':typeof defaultValue==='number'?'number':'text';label.append(input);$('config-fields').append(label,document.createElement('br'));}
const render=()=>{
 const caps=status?.maintenance;
 for(const name of buttons)$('config-'+name).disabled=busy||unavailable||(name==='confirm'&&(!preview||!caps?.confirm))||(name==='restore'&&!caps?.restore)||(name==='preview'&&!status)||(name==='backup'&&status?.state!=='ready')||(name==='save'&&!snapshot)||(name==='retry'&&(!last?.request_id||(['confirm','restore'].includes(last.operation)&&!caps?.targetChange)));
 for(const [section,key] of fields)$('setting-'+section+'-'+key).disabled=busy||!snapshot||(section==='downloads'&&key!=='enabled'&&!caps?.targetChange);
 $('config-capabilities').textContent=unavailable?'Open configuration maintenance from the Orca Host menu.':caps?.reason||(!status?'Check service to discover available operations.':status.state==='ready'?'Host configuration is ready.':'Preview both sources to confirm migration.');
};
window.toolkitConfiguration={setState:state=>{unavailable=state.configService==='host-required'||!window.orcaToolkitConfiguration;render();}};
async function call(input){if(!window.orcaToolkitConfiguration)throw Error('Open configuration maintenance from the Orca Host menu.');return window.orcaToolkitConfiguration.call(input);}
async function refresh(){
 status=await call({operation:'status'});snapshot=null;original=null;
 if(status.state==='ready'){
  snapshot=await call({operation:'read',namespace:'settings'});original=JSON.parse(snapshot.raw_json);$('config-raw').textContent=snapshot.raw_json;
  for(const [section,key,defaultValue] of fields){const input=$('setting-'+section+'-'+key),value=original[section]?.[key]??defaultValue;if(typeof defaultValue==='boolean')input.checked=value;else input.value=value;}
 }
}
async function execute(input,retry=false){if(busy)return;busy=true;render();try{
 if(!retry){last={...input};if(['preview','confirm','restore','patch'].includes(input.operation))last.request_id=crypto.randomUUID();}
 const result=await call(last);$('config-result').textContent=JSON.stringify({operation:last.operation,result},null,2);
 if(last.operation==='preview')preview={...result,store_id:status.store_id,epoch:status.epoch};
 if(last.operation==='backup')$('config-backup-id').value=result.backup_id;
 if(['confirm','restore','patch'].includes(last.operation)){preview=null;await refresh();window.dispatchEvent(new Event('toolkit-configuration-reload'));}
 if(last.operation==='status')await refresh();
}catch(e){$('config-result').textContent=e.message;}finally{busy=false;render();}}
async function source(kind){const file=$('config-'+kind+'-file').files[0],defaults=$('config-'+kind+'-defaults').checked;if(defaults&&file)throw Error('Choose either a file or defaults, not both.');if(defaults)return null;if(!file)throw Error('Select both JSON sources or explicitly choose defaults.');if(file.size>650000)throw Error('Source too large for the Toolkit upload (650 KB per document).');const bytes=new Uint8Array(await file.arrayBuffer());let raw='';for(let i=0;i<bytes.length;i+=8192)raw+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(raw);}
for(const kind of ['settings','preferences'])for(const field of ['file','defaults'])$('config-'+kind+'-'+field).onchange=()=>{preview=null;render();};
$('config-status').onclick=()=>execute({operation:'status'});
$('config-reload').onclick=()=>execute({operation:'status'});
$('config-preview').onclick=async()=>{preview=null;render();try{await execute({operation:'preview',sources:{settings:await source('settings'),'downloads-preferences':await source('preferences')}});}catch(e){$('config-result').textContent=e.message;}};
$('config-confirm').onclick=()=>{if(preview&&status?.maintenance?.confirm)return execute({operation:'confirm',preview_id:preview.preview_id,hashes:preview.hashes,store_id:preview.store_id,epoch:preview.epoch});};
$('config-backup').onclick=()=>execute({operation:'backup'});
$('config-restore').onclick=()=>{const backup_id=$('config-backup-id').value.trim();if(!/^backup-[a-f0-9]{32}\.sqlite$/.test(backup_id)){$('config-result').textContent='Enter a valid backup ID.';return;}return execute({operation:'restore',backup_id,store_id:status.store_id,epoch:status.epoch});};
$('config-retry').onclick=()=>{if(last?.request_id)return execute(last,true);};
$('config-save').onclick=()=>{if(!snapshot)return;const patch=[];for(const [section,key,defaultValue] of fields){const input=$('setting-'+section+'-'+key);if(input.disabled)continue;const value=typeof defaultValue==='boolean'?input.checked:typeof defaultValue==='number'?Number(input.value):input.value;if(value!==(original[section]?.[key]??defaultValue))patch.push({op:'set',path:[section,key],value});}if(patch.length)return execute({operation:'patch',namespace:'settings',store_id:snapshot.store_id,epoch:snapshot.epoch,revision:snapshot.revision,patch});};
render();if(!unavailable)return execute({operation:'status'});
})();
</script>
